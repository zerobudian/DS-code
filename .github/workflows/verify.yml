name: Verify
on:
  push:
  pull_request:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install desktop system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts
      - run: PYTHONPATH=engine python -m coverage run -m unittest discover -s tests -v
      - run: |
          python -m coverage combine
          mkdir -p test-results
          python -m coverage xml -o test-results/coverage.xml
      - run: QT_QPA_PLATFORM=offscreen python tests/qt_smoke.py
      - run: npm test
      - run: python -m ruff check engine sidecar tests
      - run: python -m compileall -q engine sidecar
      - run: |
          for source in renderer/js/*.js electron/*.js tests/*.js tests/*.cjs; do node --check "$source"; done
          bash -n start.sh stop.sh
      - run: node node_modules/electron/install.js
      - run: xvfb-run -a python tests/electron_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke
          path: test-results/
